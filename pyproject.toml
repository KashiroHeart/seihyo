[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "seihyo"
version = "0.1.0"
description = "PDF から表を抽出し、文字色を保ったまま Excel / CSV に出力するツール"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pdfplumber>=0.11",
    "PySide6>=6.7",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-qt>=4.4",
    "reportlab>=4",
    "ruff>=0.5",
    "pyinstaller>=6",
]

[project.gui-scripts]
seihyo = "seihyo.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]
